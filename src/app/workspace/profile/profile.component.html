<div class="max-w-2xl mx-auto mt-10 px-4" *ngIf="user">
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">

    <!-- Avatar + Name -->
    <div class="flex items-center gap-4 mb-4">
      <div class="w-16 h-16 rounded-full bg-teal-100 flex items-center justify-center text-teal-600 text-2xl font-bold">
        {{ user.name.charAt(0).toUpperCase() }}
      </div>
      <div>
        <h2 class="text-xl font-bold text-gray-800">{{ user.name }}</h2>
        <p class="text-sm text-gray-500">{{ user.designation || 'Employee' }}</p>
      </div>
    </div>

    <p-divider></p-divider>

    <!-- Details -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">

      <div class="profile-field">
        <span class="label">Employee ID</span>
        <span class="value">{{ user.employeeId }}</span>
      </div>

      <div class="profile-field">
        <span class="label">Company</span>
        <span class="value">{{ user.company }}</span>
      </div>

      <div class="profile-field">
        <span class="label">Department</span>
        <span class="value">{{ user.department }}</span>
      </div>

      <div class="profile-field">
        <span class="label">Designation</span>
        <span class="value">{{ user.designation || '—' }}</span>
      </div>

      <div class="profile-field">
        <span class="label">Phone</span>
        <span class="value">{{ user.phone }}</span>
      </div>

      <div class="profile-field">
        <span class="label">Email</span>
        <span class="value">{{ user.email }}</span>
      </div>

    </div>

  </div>
</div>
