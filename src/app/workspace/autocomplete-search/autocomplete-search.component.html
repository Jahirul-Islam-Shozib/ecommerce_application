<div class="autocomplete-wrapper">
<p-autoComplete
  [(ngModel)]="selectedProduct"
  [suggestions]="filteredProducts"
  (completeMethod)="filterProduct($event)"
  (onSelect)="onProductSelect($event)"
  optionLabel="name"
  placeholder="Search products..."
  class="custom-autocomplete"
>
  <!-- Item Template -->
  <ng-template let-product pTemplate="item">
    <div class="flex items-center gap-3 w-full hover:bg-gray-100 rounded transition">
      <!--      <img-->
      <!--        [src]="'data:image/png;base64,' + product.image"-->
      <!--        alt="{{product.name}}"-->
      <!--        class="product-thumb"-->
      <!--      />-->

      <img
        [src]="product.image"
        alt="{{product.name}}"
        class="product-thumb"
      />
      <div class="text-gray-800 font-medium">{{ product.name }}</div>
      <div class="text-gray-500 font-normal">{{ product.weightValue }} {{ product.weightUnit }}</div>
    </div>
  </ng-template>

  <!-- Header Template -->
  <ng-template pTemplate="header">
    <div class="font-medium px-3 py-2">Available Products</div>
  </ng-template>
</p-autoComplete>

  <i
    *ngIf="selectedProduct"
    class="pi pi-times clear-icon"
    (click)="clearSelectedProduct()"
  ></i>
</div>
