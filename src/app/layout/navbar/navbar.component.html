<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="px-6">
    <div class="flex justify-between items-center h-16">

      <div class="flex items-center space-x-2" routerLink="/">
        <img src="assets/images/ecom_logo.png" class="website_logo" alt="app-logo">
      </div>

      <!-- Middle: Navigation & Search -->
      <div *ngIf="!isMobile" class="flex-1 mx-8 hidden md:flex items-center justify-center space-x-6">
        <a routerLink="/products" class="text-sm text-gray-700 font-semibold hover:text-black">Shop</a>
        <app-autocomplete-search></app-autocomplete-search>
      </div>

      <!-- Right: Cart and Account -->
      <div class="flex items-center space-x-6 text-sm text-gray-800">
        <div class="flex items-center space-x-3 cursor-pointer">
          <!--          <p-overlay-badge [value]="productService.getCartItemCount()" (click)="openCart()">-->
          <!--            <i class="pi pi-shopping-cart text-lg"></i>-->
          <!--          </p-overlay-badge>-->

          <ng-container *ngIf="productService.getCartItemCount() > 0; else noBadge">
            <p-overlay-badge
              [value]="productService.getCartItemCount()"
              (click)="openCart()"
            >
              <i class="pi pi-shopping-cart text-lg cursor-pointer"></i>
            </p-overlay-badge>
          </ng-container>

          <!-- No badge when count = 0 -->
          <ng-template #noBadge>
            <i
              class="pi pi-shopping-cart text-lg cursor-pointer"
              (click)="openCart()"
            ></i>
          </ng-template>
        </div>
        <!-- If logged in: show name + select -->
        <div *ngIf="currentUser && isLoggedIn; else loginBlock" class="flex items-center space-x-2">
          <!--          <i class="pi pi-user text-lg"></i>-->
          <!--          <span class="text-sm font-semibold truncate max-w-[120px]">-->
          <!--      {{ currentUser.name }}-->
          <!--    </span>-->

          <!-- Simple select for logout -->
          <p-select
            [options]="userMenuOptions"
            optionLabel="label"
            optionValue="value"
            class="w-full text-xs"
            (onChange)="onUserOptionChange($event.value)"
          >

            <!-- Selected Value Template (placeholder-style) -->
            <ng-template pTemplate="selectedItem">
              <div class="flex items-center space-x-2 justify-center">
                <i class="pi pi-user text-base"></i>
                <span class="font-semibold truncate hidden sm:inline">
          {{ currentUser.name }}
        </span>
              </div>
            </ng-template>

            <!-- Dropdown Items -->
            <ng-template let-option pTemplate="item">
              <div class="flex items-center space-x-2">
                <i class="pi pi-user" *ngIf="option.value === 'profile'"></i>
                <i class="pi pi-shopping-bag" *ngIf="option.value === 'orders'"></i>
                <i class="pi pi-sign-out" *ngIf="option.value === 'logout'"></i>
                <span>{{ option.label }}</span>
              </div>
            </ng-template>

          </p-select>
        </div>

        <!-- If NOT logged in: show login icon -->
        <ng-template #loginBlock>
          <div class="flex items-center space-x-1 cursor-pointer">
            <i class="pi pi-user text-lg" routerLink="/auth/login"></i>
          </div>
        </ng-template>
      </div>

    </div>
  </div>
</nav>

<app-dialog-cart
  [visible]="cartDialogVisible"
  (closeCart)="cartDialogVisible = $event">
</app-dialog-cart>
